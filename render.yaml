services:
  - type: web
    name: campuspulse-alpha-x1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_DEAN_KEY
        sync: false
